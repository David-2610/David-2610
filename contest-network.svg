<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">David Tembhare</title>
  <desc id="desc">An illustrated local contest network. A submission moves from a terminal through a queue to three judges.</desc>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#444a42"/></pattern>
    <g id="judge" stroke-linejoin="round"><path d="m0 0 32-16 32 16-32 16z" fill="#efeee2"/><path d="m0 0 32 16v10L0 10z" fill="#b7b9a9"/><path d="m32 16 32-16v10L32 26z" fill="#707a68"/></g>
    <style>@keyframes submit{to{stroke-dashoffset:-90}}.signal{animation:submit 3s linear infinite}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style>
  </defs>
  <rect width="960" height="240" rx="8" fill="#202621"/>
  <rect x="447" y="12" width="502" height="216" fill="url(#dots)"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#f5f1e7">
    <text x="40" y="103" font-size="72" font-weight="700" letter-spacing="-3">David</text>
    <text x="38" y="180" font-size="81" font-weight="700" letter-spacing="-4">Tembhare</text>
  </g>
  <g fill="none" stroke="#919c8d" stroke-width="2"><path d="M542 130h119l75-48h65m-140 48h140m-140 0 75 48h65"/></g>
  <path class="signal" d="M542 130h119l75-48h65" fill="none" stroke="#ff7951" stroke-width="4" stroke-dasharray="9 81"/>
  <g stroke="#202621" stroke-width="2">
    <use href="#judge" x="799" y="75"/><use href="#judge" x="799" y="123"/><use href="#judge" x="799" y="171"/>
    <use href="#judge" x="634" y="130"/><use href="#judge" x="634" y="122"/><use href="#judge" x="634" y="114"/>
  </g>
  <g transform="translate(480 97)" stroke-linejoin="round">
    <path d="M0 0h65v48H0z" fill="#313b33" stroke="#eeede0" stroke-width="3"/>
    <path d="m0 48-12 11h88l-11-11" fill="#c1c5b5"/>
    <path d="m13 13 10 8-10 8m16 0h13" fill="none" stroke="#ff7951" stroke-width="3"/>
  </g>
</svg>
